services:
  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    restart: unless-stopped
    ports:
      - 2375:2375
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins

  jenkins-server:
    depends_on:
      - jenkins-docker
    build:
      context: ./jenkins
      dockerfile: DockerFile-jenkins-server
    image: myjenkins-blueocean:2.555.3-1
    container_name: jenkins-blueocean
    privileged: true
    environment:
      DOCKER_HOST: tcp://jenkins-docker:2375
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins

  jenkins-agent:
    depends_on:
      - jenkins-server
    build:
      context: ./jenkins
      dockerfile: DockerFile-jenkins-agent-maven
    image: myjenkins-agent-maven
    container_name: jenkins-agent
    env_file: 
      - ./jenkins/ja.env
    environment:
      JENKINS_URL: http://jenkins-server:8080
      DOCKER_HOST: tcp://jenkins-docker:2375
      KUBECONFIG: /home/jenkins/kubeconfig
    restart: unless-stopped
    volumes:
      - agent_home:/home/jenkins/agent
      - maven_cache:/home/jenkins/.m2
      - /home/user/.kube/config-jenkins:/home/jenkins/kubeconfig:ro
    networks:
      - jenkins
      - kind

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - jenkins


  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.17.28
    expose:
      - 9200
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    networks:
      - logging
      - kind

  kibana:
    container_name: kibana
    image: kibana:7.17.28
    ports:
      - "5601:5601"
    networks:
      - logging


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - './monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml'
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - './monitoring/grafana/provisioning:/etc/grafana/provisioning'
      - './monitoring/grafana/dashboards:/var/lib/grafana/dashboards'
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - 8081:8080
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
      - '/dev/disk:/dev/disk:ro'
    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - 9115:9115
    volumes:
      - './monitoring/blackbox/blackbox.yaml:/etc/blackbox_exporter/config.yaml'
    command:
      - '--config.file=/etc/blackbox_exporter/config.yaml'
    networks:
      - monitoring
    extra_hosts:
    - "host.docker.internal:host-gateway"


networks:
  jenkins:
  logging:
  monitoring:
  kind:
    external: true

volumes:
  jenkins_home:
  agent_home:
  maven_cache:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

