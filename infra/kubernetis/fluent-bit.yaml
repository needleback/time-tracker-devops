config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        #Log_Level debug
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On


  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Tag kube.*
        multiline.parser docker, cri
        DB /var/log/flb_kube.db
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On


  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Labels On
        Annotations On

    [FILTER]
        Name grep
        Match kube.*
        Regex kubernetes['namespace_name'] ^diplom$


  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch
        Port 9200
        Logstash_Format On
        Logstash_Prefix time-tracker
        Suppress_Type_Name On
